# Loaded through IDEA_PROPERTIES by dockerized-idea.sh.
# All directories are bind mounts of ./system-config-logs-plugins/<base image>/{config,system,logs,plugins} on the host.
idea.config.path=/home/my_user/system-config-logs-plugins/config
idea.system.path=/home/my_user/system-config-logs-plugins/system
idea.log.path=/home/my_user/system-config-logs-plugins/logs
idea.plugins.path=/home/my_user/system-config-logs-plugins/plugins
